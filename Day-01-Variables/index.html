<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Series</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <div class="avatar">JS</div>
        <h2 id="user-name">Loading...</h2>
        <span class="badge" id="job-status">Status</span>
      </div>

      <div class="card-body">
        <div class="info-row">
          <span>Age:</span>
          <strong id="user-age">-</strong>
        </div>
        <div class="info-row">
          <span>Primary Skill:</span>
          <strong id="user-skill">-</strong>
        </div>
        <div class="info-row">
          <span>Balance ($):</span>
          <strong id="user-balance">-</strong>
        </div>
      </div>

      <div class="card-footer">
        <h3>Data Types & Coercion Check</h3>
        <ul id="type-list"></ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
